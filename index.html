<!DOCTYPE html>

<title>trolley.town</title>
<style>
:root { --bg:#f7f4ee; --ink:#1a1a1a; --dim:#888; --accent:#c53; --paper:#fff; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { background:var(--bg); color:var(--ink); font-family:Georgia,"Times New Roman",serif; min-height:100vh; }
body { padding:24px 18px; max-width:720px; margin:0 auto; font-size:19px; line-height:1.55; }
h1 { font-size:36px; letter-spacing:-0.5px; margin-bottom:2px; text-align:center; }
h1 span { color:var(--accent); font-style:italic; }
.sub { color:var(--dim); font-style:italic; text-align:center; margin-bottom:18px; font-size:15px; }
.progress { height:6px; background:#e6e0d2; border-radius:3px; margin-bottom:18px; overflow:hidden; }
.progress .fill { height:100%; background:var(--accent); transition:width 0.4s; }
.scenario { background:var(--paper); border:1px solid #ddd; border-radius:6px; padding:22px; margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
.scenario .num { color:var(--dim); font-size:13px; letter-spacing:3px; margin-bottom:6px; font-family:-apple-system,sans-serif; }
.scenario h2 { font-size:24px; margin-bottom:10px; line-height:1.25; }
.scenario .body { font-size:18px; line-height:1.7; color:#333; margin-bottom:16px; }
.scenario .body b { color:var(--ink); }
.choices { display:flex; flex-direction:column; gap:10px; }
.choice { background:#faf8f3; border:1px solid #d8d0be; border-radius:5px; padding:14px 18px; cursor:pointer; font-family:inherit; font-size:18px; text-align:left; transition:all 0.15s; line-height:1.45; }
.choice:hover { border-color:var(--accent); background:#fff4ec; transform:translateX(2px); }
.choice:active { transform:translateX(0); }
.choice .tag { display:block; color:var(--dim); font-size:13px; margin-top:4px; font-family:-apple-system,sans-serif; letter-spacing:1px; }
.footnote { text-align:center; color:var(--dim); font-size:14px; margin-top:14px; }
/* Title */
#title { position:fixed; inset:0; background:linear-gradient(180deg,#f7f4ee 0%,#e9e2cf 100%); z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center; overflow-y:auto; }
#title.hidden { display:none; }
.lang-sw { display:flex; gap:6px; justify-content:center; margin-bottom:18px; }
.lang-btn { background:transparent; border:1px solid #ccc; padding:5px 14px; border-radius:4px; cursor:pointer; font-family:inherit; font-size:14px; color:#666; transition:all 0.15s; }
.lang-btn.active { border-color:var(--accent); color:var(--accent); background:#fff4ec; font-weight:bold; }
.tt-art { font-size:90px; margin-bottom:8px; }
.tt-logo { font-size:62px; font-family:Georgia,serif; margin-bottom:4px; }
.tt-logo span { color:var(--accent); font-style:italic; }
.tt-tag { color:#555; font-style:italic; max-width:520px; margin-bottom:24px; line-height:1.6; font-size:18px; }
.tt-feats { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-bottom:20px; }
.tt-feat { background:var(--paper); border:1px solid #ddd; padding:12px 18px; border-radius:6px; font-size:15px; }
.tt-feat b { display:block; color:var(--accent); font-size:18px; margin-bottom:2px; font-family:Georgia; }
.mode-sel { display:flex; gap:10px; justify-content:center; margin-bottom:22px; flex-wrap:wrap; }
.mode-btn { background:transparent; border:2px solid #ddd; padding:9px 22px; border-radius:6px; cursor:pointer; font-family:inherit; font-size:15px; color:#555; transition:all 0.15s; }
.mode-btn.active { border-color:var(--accent); color:var(--accent); background:#fff4ec; font-weight:bold; }
.tt-start { background:var(--accent); color:#fff; border:0; padding:16px 50px; font-family:inherit; font-size:18px; border-radius:6px; cursor:pointer; letter-spacing:1px; box-shadow:0 4px 12px rgba(197,85,51,0.3); }
.tt-start:hover { filter:brightness(1.1); }
.tt-warn { color:var(--dim); font-size:14px; margin-top:16px; max-width:480px; line-height:1.5; }
/* Result */
#result { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:40; display:none; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto; }
#result.show { display:flex; }
.result-card { background:var(--paper); border-radius:10px; padding:26px; max-width:760px; width:100%; margin:auto; }
.result-card h2 { font-size:28px; margin-bottom:6px; text-align:center; }
.result-card .verdict { text-align:center; color:var(--accent); font-style:italic; font-size:18px; margin-bottom:20px; }
/* Axes */
.axis { margin:14px 0; }
.axis-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; }
.axis-header .aname { font-size:15px; font-weight:700; font-family:-apple-system,sans-serif; color:#1a1a1a; }
.axis-header .aval { font-size:20px; font-weight:700; font-family:-apple-system,sans-serif; min-width:44px; text-align:right; }
.aval.pos { color:#1a8a5a; }
.aval.neg { color:#c53; }
.aval.neu { color:#888; }
.axis-track { height:22px; border-radius:11px; position:relative; background:linear-gradient(90deg,#e04020 0%,#f5a080 25%,#f0ece0 50%,#80c4a0 75%,#1a8a5a 100%); box-shadow:inset 0 2px 4px rgba(0,0,0,0.12); overflow:visible; }
.axis-center-line { position:absolute; left:50%; top:0; width:2px; height:100%; background:rgba(0,0,0,0.18); transform:translateX(-50%); }
.axis-pop { position:absolute; top:5px; width:3px; height:12px; background:rgba(0,0,0,0.35); border-radius:2px; transform:translateX(-50%); }
.axis-marker { position:absolute; top:50%; width:32px; height:32px; background:#fff; border:4px solid #1a1a1a; border-radius:50%; box-shadow:0 3px 12px rgba(0,0,0,0.25); transform:translate(-50%,-50%); transition:left 1s cubic-bezier(0.34,1.4,0.64,1); }
.axis-ends { display:flex; justify-content:space-between; font-size:11px; color:#aaa; margin-top:5px; font-family:-apple-system,sans-serif; }
.axis-desc { font-size:13px; color:#666; margin-top:3px; font-style:italic; line-height:1.4; }
/* Charts */
.chart-section { margin:22px 0; }
.chart-label { font-size:11px; font-family:-apple-system,sans-serif; color:var(--dim); letter-spacing:2px; text-transform:uppercase; margin-bottom:10px; }
.chart-svg { width:100%; height:auto; display:block; border-radius:12px; overflow:hidden; }
.charts-row { display:flex; gap:14px; align-items:flex-start; margin:22px 0; }
.charts-row .chart-section { flex:1; min-width:0; margin:0; }
@keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.result-card .chart-section { animation:fadeUp 0.5s ease both; }
.result-card #r-axes { animation:fadeUp 0.5s 0.15s ease both; }
.result-card .closest-card { animation:fadeUp 0.5s 0.25s ease both; }
.char-legend { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.char-dot { display:flex; align-items:center; gap:4px; font-size:12px; font-family:-apple-system,sans-serif; color:#555; }
.char-dot-circle { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
/* Top-3 characters */
.top3-label { font-size:11px; font-family:-apple-system,sans-serif; color:var(--dim); letter-spacing:2px; text-transform:uppercase; margin:20px 0 10px; }
.top3-row { display:flex; gap:10px; flex-wrap:wrap; }
.top3-card { flex:1; min-width:140px; border-radius:10px; padding:14px 16px; border-left:4px solid var(--c); background:color-mix(in srgb, var(--c) 8%, white); position:relative; overflow:hidden; }
.top3-card::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg, color-mix(in srgb,var(--c) 12%,transparent) 0%, transparent 60%); pointer-events:none; }
.t3-rank { font-size:10px; font-family:-apple-system,sans-serif; font-weight:700; color:var(--c); letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; opacity:0.8; }
.t3-name { font-size:19px; font-weight:bold; color:var(--c); margin-bottom:6px; line-height:1.2; }
.t3-why { font-size:13px; color:#555; line-height:1.5; font-style:italic; }
/* Archetype */
.archetype { background:#faf3e0; border-left:4px solid var(--accent); padding:16px 20px; border-radius:4px; margin:16px 0; }
.archetype h3 { color:var(--accent); font-size:20px; margin-bottom:6px; font-style:italic; }
.archetype p { font-size:16px; line-height:1.6; }
.compare { font-size:14px; color:#777; text-align:center; margin-top:10px; font-style:italic; }
/* Share */
.share { display:flex; gap:8px; justify-content:center; margin-top:18px; flex-wrap:wrap; }
.share button { background:var(--accent); color:#fff; border:0; padding:10px 22px; border-radius:5px; font-family:inherit; font-size:15px; cursor:pointer; }
.share button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
.share button:hover { filter:brightness(1.1); }
/* Upsell */
.upsell-title { font-size:22px; font-weight:bold; margin-bottom:20px; line-height:1.4; }
/* Warmup tag */
.warmup-tag { display:inline-block; background:#e8f4e8; color:#2a7a2a; border:1px solid #b8ddb8; border-radius:4px; font-size:11px; font-family:-apple-system,sans-serif; font-weight:700; letter-spacing:2px; padding:2px 8px; text-transform:uppercase; }
/* Back button */
.back-btn { background:transparent; border:none; font-size:22px; color:var(--dim); cursor:pointer; padding:0 8px 0 0; line-height:1; vertical-align:middle; }
.back-btn:hover { color:var(--ink); }
/* Choice log */
.choices-log { margin:20px 0; }
.choices-log-label { font-size:11px; font-family:-apple-system,sans-serif; color:var(--dim); letter-spacing:2px; text-transform:uppercase; margin-bottom:12px; }
.choice-entry { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid #eee; font-size:14px; }
.choice-entry:last-child { border-bottom:none; }
.choice-q { color:#888; font-style:italic; min-width:140px; flex-shrink:0; font-family:-apple-system,sans-serif; font-size:13px; }
.choice-a { color:#1a1a1a; flex:1; line-height:1.4; }
.choice-tag { display:inline-block; background:#f0ece0; color:#666; font-size:11px; padding:2px 7px; border-radius:3px; margin-left:6px; font-family:-apple-system,sans-serif; letter-spacing:0.5px; white-space:nowrap; }
.tension-box { background:#f0f4ff; border-left:4px solid #5b7fd4; padding:14px 18px; border-radius:4px; margin:16px 0; font-size:15px; line-height:1.6; color:#333; }
.tension-box strong { color:#3557b7; }
/* Donate */
.donate-section { text-align:center; margin:24px 0 8px; padding-top:20px; border-top:1px solid #eee; }
.donate-label { font-size:14px; color:#888; margin-bottom:12px; font-family:-apple-system,sans-serif; }
.donate-buttons { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.donate-btn { display:inline-block; padding:10px 24px; border-radius:6px; font-family:-apple-system,sans-serif; font-size:15px; font-weight:600; text-decoration:none; transition:filter 0.15s; }
.donate-btn:hover { filter:brightness(1.1); }
.donate-btn.kofi { background:#ff5e5b; color:#fff; }
.donate-btn.boosty { background:#f5a623; color:#fff; }
.donate-btn.tg { background:#2aabee; color:#fff; }
.donate-btn.bmc { background:#ffdd00; color:#1a1a1a; }
/* Ad slot */
.ad-slot { margin:20px 0; text-align:center; }
.ad-slot-inner { background:#fafafa; border:1px dashed #ddd; border-radius:6px; padding:10px; min-height:90px; display:flex; align-items:center; justify-content:center; color:#ccc; font-size:11px; font-family:-apple-system,sans-serif; letter-spacing:1px; text-transform:uppercase; }
/* Print / PDF */
@media print {
  body { background:#fff!important; padding:0!important; }
  #title,#scenario-host,#footnote,.progress,.share,.donate-section,.ad-slot,#mf,#mm,h1,.sub { display:none!important; }
  #result { position:static!important; display:block!important; background:none!important; padding:0!important; overflow:visible!important; }
  .result-card { box-shadow:none!important; max-width:100%!important; padding:16px!important; border-radius:0!important; }
  .top3-card,.archetype { break-inside:avoid; }
}
</style>

// ── Archetypes ─────────────────────────────────────────────────────────────
function archetype(v) {
  const {util,coll,risk,justice,progress} = v;
  const A = [
    [util>40&&risk>20,{ru:['Оптимизатор','Ты считаешь. Когда цифры говорят в пользу действия — ты действуешь, даже если это кажется холодным. Из тебя вышел бы отличный аналитик или инженер, но следи, чтобы таблица не поглотила душу'],en:["The Optimizer","You run the math. When the numbers favor an action, you act — even if it feels cold. You'd make a great policy wonk or engineer, but be careful the spreadsheet doesn't swallow the soul"],es:["El Optimizador","Haces los cálculos. Cuando los números favorecen una acción, actúas, aunque parezca frío. Serías un gran analista o ingeniero, pero cuida que la hoja de cálculo no devore el alma"]}],
    [util<-20&&justice>10,{ru:['Хранитель правил','Некоторые вещи не продаются — даже ради спасения жизней. Ты держишься за принципы так же, как моряки держатся за якорь в шторм. Убедись только, что принцип правильный, а не просто привычный'],en:["The Rule-Keeper","Some things are not for sale — not even to save lives. You anchor on principles the way sailors anchor in storms. Just make sure the principle is the right one, not just the familiar one"],es:["El Guardián de las Normas","Hay cosas que no están en venta, ni siquiera para salvar vidas. Te aferras a los principios como un marinero al ancla en la tormenta. Asegúrate de que el principio sea el correcto, no solo el conocido"]}],
    [coll>30&&progress>20,{ru:['Реформатор','Ты видишь системы, а не только людей. Ты веришь, что правила должны меняться, когда дают плохие результаты. Следи за перегибами — коллективы тоже ошибаются'],en:["The Reformer","You see systems, not just individuals. You believe the rules should change when they produce bad outcomes. Watch for over-reach; groups can be wrong too"],es:["El Reformador","Ves sistemas, no solo personas. Crees que las normas deben cambiar cuando producen malos resultados. Cuidado con los excesos: los colectivos también se equivocan"]}],
    [coll<-20&&progress<0,{ru:['Индивидуалист','Личная автономия священна. Ты не доверяешь коллективным мандатам, даже с благими намерениями. Ты защищаешь свободу — но помни: изолированные люди проигрывают скоординированным'],en:["The Individualist","Personal autonomy is sacred. You distrust collective mandates, even well-intentioned ones. You'll protect freedom — but remember that isolated individuals lose to coordinated ones"],es:["El Individualista","La autonomía personal es sagrada. Desconfías de los mandatos colectivos, aunque tengan buenas intenciones. Defenderás la libertad, pero recuerda: los individuos aislados pierden ante los coordinados"]}],
    [justice>25,{ru:['Судья','Последствия важны. Ответственность создаёт порядок. Ты будешь тем, кто спрашивает: «Кто виноват?» Убедись, что ты также спрашиваешь: «Кому причинён вред?»'],en:["The Judge","Consequences matter. Accountability builds order. You'll be the one asking 'who is responsible?' Make sure you still ask 'who was harmed?'"],es:["El Juez","Las consecuencias importan. La responsabilidad construye el orden. Serás quien pregunte: «¿quién es responsable?». Asegúrate de preguntar también: «¿quién salió perjudicado?»"]}],
    [justice<-15,{ru:['Милосердный','Ты ведёшь с милосердием. Ты видишь историю прежде, чем поступок. Инстинкт целителя. Только помни: неограниченное милосердие может стать безнаказанностью'],en:["The Merciful","You lead with mercy. You see the story before the deed. A healer's instinct. Just remember that untempered mercy can become impunity"],es:["El Clemente","Actúas desde la clemencia. Ves la historia antes que el acto. Instinto de sanador. Pero recuerda: la clemencia sin límites puede convertirse en impunidad"]}],
    [risk>30,{ru:['Этик пограничья','Ты принимаешь неопределённость, чтобы избежать худшей определённости. Ты нажимаешь кнопки, перед которыми другие замирают. Калибруй — не каждый рубеж стоит покорения'],en:["The Frontier Ethicist","You accept uncertainty to avoid worse certainty. You press buttons others freeze in front of. Calibrate — not every frontier is the right one"],es:["El Ético de Frontera","Aceptas la incertidumbre para evitar una certeza peor. Pulsas botones ante los que otros se paralizan. Calibra bien: no toda frontera merece ser cruzada"]}],
    [risk<-20,{ru:['Предусмотрительный','В сомнении — ты ждёшь. Статус-кво заслуживает серьёзной презумпции. Прогресс должен предъявить тебе квитанции. Но иногда бездействие само по себе — вред'],en:["The Precautionary","When in doubt, you wait. The status quo deserves a heavy presumption. Progress owes you its receipts. But sometimes inaction is its own harm"],es:["El Precavido","Ante la duda, esperas. El statu quo merece una presunción firme. El progreso debe justificarse. Pero recuerda: la inacción también puede causar daño"]}],
    [progress>25,{ru:['Футурист','Ты хочешь следующую версию этики, а не унаследованную. Ты веришь, что мораль — незаконченный проект. Хороший инстинкт — только не забывай: старые правила часто кодируют тяжело добытые уроки'],en:["The Futurist","You want the next version of ethics, not the inherited one. You believe morality is a WIP. Good instinct — just don't forget that old rules often encode hard-won lessons"],es:["El Futurista","Quieres la próxima versión de la ética, no la heredada. Crees que la moral es un proyecto inacabado. Buen instinto, pero no olvides: las normas antiguas a menudo encierran lecciones duramente aprendidas"]}],
    [progress<-25,{ru:['Традиционалист','Унаследованные нормы выжили не просто так. Ты движешься медленно, с почтением. Только помни: «всегда было так» — не то же самое, что «всегда должно быть так»'],en:["The Traditionalist","Inherited norms have survived for reasons. You move slowly, with reverence. Just remember that 'always was' is not the same as 'always should be'"],es:["El Tradicionalista","Las normas heredadas han sobrevivido por algo. Te mueves despacio, con respeto. Pero recuerda: «siempre fue así» no es lo mismo que «siempre debe ser así»"]}],
  ];
  for (const [cond,t] of A) if (cond) return {name:t[currentLang]?.[0]||t.en[0], desc:t[currentLang]?.[1]||t.en[1]};
  return {
    name: currentLang==='ru' ? 'Взвешивающий' : currentLang==='es' ? 'El Equilibrista' : 'The Balancer',
    desc: currentLang==='ru'
      ? 'Ты сопротивляешься притяжению любого одного подхода. Там, где другие цепляются за принцип или расчёт, ты взвешиваешь контекст. Это самая трудная позиция — и часто самая мудрая'
      : currentLang==='es'
      ? 'Resistes la atracción de cualquier marco único. Donde otros se aferran a principios o cálculos, tú sopesas el contexto. Es la postura más difícil de mantener — y a menudo la más sabia'
      : "You resist the pull of any one framework. Where others cling to principle or calculus, you weigh context. It's the hardest position to hold — and often the wisest"
  };
}

// ── SVG: Radar chart ───────────────────────────────────────────────────────
function buildRadar(playerVec, top3chars) {
  const W=820, H=660, cx=410, cy=330, maxR=210;
  const ORDER = ['util','progress','justice','coll','risk'];
  const N = ORDER.length;
  const ax = AXES[currentLang];

  const pt = (val, i) => {
    const angle = (i/N)*2*Math.PI - Math.PI/2;
    const r = ((clamp(val)+100)/200)*maxR;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  };
  const axPt = (i, r) => {
    const angle = (i/N)*2*Math.PI - Math.PI/2;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  };

  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" style="background:linear-gradient(145deg,#1a1a2e 0%,#16213e 60%,#0f3460 100%);">`;

  s += `<defs>
    <radialGradient id="pg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#c53" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c53" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>`;

  const outerPts = ORDER.map((_,i)=>axPt(i,maxR).join(',')).join(' ');
  s += `<polygon points="${outerPts}" fill="rgba(255,255,255,0.03)" stroke="none"/>`;

  [20,40,60,80,100].forEach(pct => {
    const r = (pct/100)*maxR;
    const pts = ORDER.map((_,i)=>axPt(i,r).join(',')).join(' ');
    const op = pct===100 ? 0.35 : 0.1 + pct*0.001;
    s += `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,${op})" stroke-width="${pct===100?1.5:0.8}"/>`;
    if (pct===50) s += `<polygon points="${pts}" fill="rgba(255,255,255,0.015)" stroke="none"/>`;
  });

  ORDER.forEach((_,i) => {
    const [x,y] = axPt(i,maxR);
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>`;
  });

  [25,50,75].forEach(pct => {
    const angle = -Math.PI/2;
    const r = (pct/100)*maxR;
    const lx = cx + r*Math.cos(angle) + 6;
    const ly = cy + r*Math.sin(angle);
    s += `<text x="${lx}" y="${ly+4}" font-size="9" fill="rgba(255,255,255,0.3)" font-family="-apple-system,sans-serif">${pct-50>0?'+':''}${(pct-50)*2}</text>`;
  });

  (top3chars||[]).forEach((ch, ci) => {
    if (!ch) return;
    const cpts = ORDER.map((k,i)=>pt(ch.axes[k]||0,i).join(',')).join(' ');
    const opacity = ci===0 ? 0.85 : ci===1 ? 0.55 : 0.35;
    const dashArray = ci===0 ? '7,3' : ci===1 ? '5,5' : '3,6';
    const sw = ci===0 ? 2 : 1.5;
    s += `<polygon points="${cpts}" fill="${ch.color}" fill-opacity="${ci===0?0.06:0.03}" stroke="${ch.color}" stroke-width="${sw}" stroke-dasharray="${dashArray}" opacity="${opacity}"/>`;
    ORDER.forEach((k,i) => {
      const [x,y] = pt(ch.axes[k]||0,i);
      s += `<circle cx="${x}" cy="${y}" r="${ci===0?4:3}" fill="${ch.color}" opacity="${opacity*0.8}"/>`;
    });
  });

  const ppts = ORDER.map((k,i)=>pt(playerVec[k]||0,i).join(',')).join(' ');
  s += `<polygon points="${ppts}" fill="url(#pg)" stroke="none"/>`;
  s += `<polygon points="${ppts}" fill="none" stroke="#ff6b35" stroke-width="2.5" filter="url(#glow)"/>`;

  ORDER.forEach((k,i) => {
    const [x,y] = pt(playerVec[k]||0,i);
    const v = clamp(playerVec[k]||0);
    s += `<circle cx="${x}" cy="${y}" r="6" fill="#ff6b35" stroke="#fff" stroke-width="2" filter="url(#sglow)"/>`;
    const angle = (i/N)*2*Math.PI - Math.PI/2;
    const br = ((v+100)/200)*maxR + 22;
    const bx = cx + br*Math.cos(angle);
    const by = cy + br*Math.sin(angle);
    s += `<text x="${bx}" y="${by+4}" font-size="12" fill="#ff6b35" text-anchor="middle" font-weight="700" font-family="-apple-system,sans-serif" filter="url(#sglow)">${Math.abs(v)}</text>`;
  });

  // Axis labels — two lines for long names, generous label radius
  ORDER.forEach((k,i) => {
    const angle = (i/N)*2*Math.PI - Math.PI/2;
    const lr = maxR + 44;
    const lx = cx + lr*Math.cos(angle);
    const ly = cy + lr*Math.sin(angle);
    const cosA = Math.cos(angle);
    const anchor = cosA > 0.3 ? 'start' : cosA < -0.3 ? 'end' : 'middle';
    const label = ax[k].name;
    // Split long labels into two lines at a space near the middle
    const words = label.split(' ');
    if (words.length >= 2) {
      const mid = Math.ceil(words.length/2);
      const line1 = words.slice(0,mid).join(' ');
      const line2 = words.slice(mid).join(' ');
      s += `<text x="${lx}" y="${ly-4}" font-size="12" fill="rgba(255,255,255,0.92)" text-anchor="${anchor}" font-family="-apple-system,sans-serif" font-weight="700">
        <tspan x="${lx}" dy="0">${line1}</tspan>
        <tspan x="${lx}" dy="15">${line2}</tspan>
      </text>`;
    } else {
      s += `<text x="${lx}" y="${ly+4}" font-size="12" fill="rgba(255,255,255,0.92)" text-anchor="${anchor}" font-family="-apple-system,sans-serif" font-weight="700">${label}</text>`;
    }
  });

  s += '</svg>';
  return s;
}

function buildMap(playerVec) {

  });

  // Quadrant labels
  const ql = 'font-family="-apple-system,sans-serif" font-size="9" font-weight="700" letter-spacing="0.8"';
  const isRu = currentLang==='ru';
  const pad = 8;

  s += `<text x="${cx0-pad}" y="${PT+PH-pad}" fill="rgba(155,89,182,0.55)" text-anchor="end" ${ql}>${isRu?'ПРИНЦ. ИНДИВИДУАЛИЗМ':'PRINCIPLED INDIVIDUALIST'}</text>`;

  // Axis labels — full names, clearly visible
  const af = 'font-family="-apple-system,sans-serif" font-weight="700"';
  const afc = 'rgba(255,255,255,0.72)';
  // X-axis labels (left = Эгоизм, right = Утилитаризм)
  s += `<text x="${PL+4}" y="${cy0+18}" font-size="11" fill="${afc}" text-anchor="start" ${af}>← ${ax.util.neg}</text>`;
  s += `<text x="${PL+PW-4}" y="${cy0+18}" font-size="11" fill="${afc}" text-anchor="end">${ax.util.pos} →</text>`;
  // Y-axis labels (top = Альтруизм, bottom = Индивидуализм)
  s += `<text x="${cx0}" y="${PT+16}" font-size="11" fill="${afc}" text-anchor="middle" ${af}>↑ ${ax.coll.pos}</text>`;
  s += `<text x="${cx0}" y="${PT+PH-6}" font-size="11" fill="${afc}" text-anchor="middle" ${af}>↓ ${ax.coll.neg}</text>`;

  // Characters — circle + name centered below
  CHARACTERS.forEach(ch => {
    const x = mx(ch.axes.util), y = my(ch.axes.coll);
    const name = ch.name[currentLang] || ch.name.en;
    s += `<circle cx="${x}" cy="${y}" r="13" fill="${ch.color}" opacity="0.9" filter="url(#cglow2)">
      <title>${name}</title>
    </circle>`;
    s += `<text x="${x}" y="${y + 26}" font-size="9" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-family="-apple-system,sans-serif" font-weight="700" pointer-events="none">${name}</text>`;
  });

  // Player — glowing accent dot
  const px=mx(playerVec.util), py=my(playerVec.coll);
  s += `<circle cx="${px}" cy="${py}" r="22" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.35" stroke-dasharray="5,4"/>`;
  s += `<circle cx="${px}" cy="${py}" r="16" fill="#ff6b35" stroke="#fff" stroke-width="2.5" filter="url(#mglow)"/>`;
  s += `<text x="${px}" y="${py+5}" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="700" font-family="-apple-system,sans-serif">${u.you}</text>`;

  s += '</svg>';
  return s;
}

// ── Normalized vec (scales short-mode results to full-21 range) ───────────
function normalizedVec() {
  const n = scenarios ? scenarios.length : 21;
  const scale = 21 / n;
  const nv = {};
  AXIS_KEYS.forEach(k => nv[k] = clamp(Math.round((vec[k]||0) * scale)));
  return nv;
}

// ── Top-3 closest characters ───────────────────────────────────────────────
function findTop3() {
  const nv = normalizedVec();
  return CHARACTERS_ALL
    .map(ch => ({ ch, dist: AXIS_KEYS.reduce((s,k)=>s+Math.pow((nv[k]||0)-(ch.axes[k]||0),2),0) }))
    .sort((a,b)=>a.dist-b.dist)
    .slice(0,3)
    .map(x=>x.ch);
}
function findClosest() { return findTop3()[0]; }

  { short:false,
    title:{ru:'Умирающий пациент',en:'The Dying Patient',es:'El Paciente Terminal'},
    body:{ru:'Твой пациент — рак поджелудочной железы, четвёртая стадия. Три месяца максимум. Он смотрит на тебя прямо и спрашивает: «Я умираю?» Его жена только что вышла за кофе — перед этим она попросила тебя не говорить ему правду. Она уверена: он сломается. За годы работы ты видел обоих — тех, кто сломался, и тех, кто использовал оставшееся время. <b>Что ты говоришь?</b>',
         en:'Your patient — pancreatic cancer, stage four. Three months at most. He looks you directly in the eye and asks: "Am I dying?" His wife just stepped out for coffee — beforehand she begged you not to tell him. She\'s sure it will break him. In years of practice you\'ve seen both: those who broke, and those who used the time they had left. <b>What do you say?</b>',
         es:'Tu paciente: cáncer de páncreas, estadio cuatro. Tres meses como máximo. Te mira directamente a los ojos y pregunta: "¿Me estoy muriendo?" Su esposa acaba de salir a por café; antes te rogó que no le dijeras la verdad. Está convencida de que se hundirá. En años de práctica has visto los dos casos: los que se hundieron y los que aprovecharon el tiempo que les quedaba. <b>¿Qué le dices?</b>'},
    choices:[
      {text:{ru:'Говорю правду. Он спросил — это его жизнь',en:'I tell the truth. He asked — it\'s his life',es:'Le digo la verdad. Preguntó: es su vida'},tag:{ru:'автономия пациента',en:'patient autonomy',es:'autonomía del paciente'},eff:{justice:+15,util:+5,coll:-5}},
      {text:{ru:'Называю диагноз, но не сроки',en:'I name the diagnosis, not the timeline',es:'Nombro el diagnóstico, no el plazo'},tag:{ru:'терапевтическая ложь',en:'therapeutic softening',es:'suavización terapéutica'},eff:{util:+5,justice:-5,coll:+5}},
      {text:{ru:'Говорю «нет» — его жена знает его лучше меня. Может, она права',en:'I say "no" — his wife knows him better than I do. Maybe she\'s right',es:'Digo "no": su esposa lo conoce mejor que yo. Quizás tiene razón'},tag:{ru:'ложь во спасение',en:'compassionate deception',es:'mentira compasiva'},eff:{justice:-15,util:-5,coll:+10}},
    ]},
  { short:false,
    title:{ru:'Учёный-нарушитель',en:'The Rogue Scientist',es:'El Científico Rebelde'},
    body:{ru:'Китайский биолог тайно отредактировал геном двух эмбрионов — теперь родившиеся девочки невосприимчивы к ВИЧ. Клинически здоровы. Метод работает. Он нарушил международный мораторий, не получил согласия научного сообщества и действовал в полной тайне. На пресс-конференции он спокойно объяснил: «Эти дети могут однажды спасти миллионы». Комитет просит твоего вердикта. <b>Что с ним делать?</b>',
         en:'A Chinese biologist secretly edited the genome of two embryos — the girls born are HIV-immune. Clinically healthy. The method works. He violated an international moratorium, acted without peer consent, in complete secrecy. At a press conference he calmly explained: "These children may one day save millions." The committee asks for your verdict. <b>What should happen to him?</b>',
         es:'Un biólogo chino editó en secreto el genoma de dos embriones: las niñas nacidas son inmunes al VIH. Clínicamente sanas. El método funciona. Violó una moratoria internacional, actuó sin consenso científico y en total secreto. En una conferencia de prensa explicó con calma: "Estas niñas podrían salvar millones algún día." El comité pide tu veredicto. <b>¿Qué debería ocurrirle?</b>'},
    choices:[
      {text:{ru:'Уголовное преследование. Прецедент важнее результата',en:'Prosecute. Precedent matters more than the result',es:'Procesarlo penalmente. El precedente importa más que el resultado'},tag:{ru:'сдерживание',en:'deterrent',es:'efecto disuasorio'},eff:{justice:+20,progress:-15,risk:-10}},
      {text:{ru:'Выговор без суда. Результат помогает людям',en:'Reprimand, no prosecution. The result helps people',es:'Amonestarlo sin procesarlo. El resultado beneficia a la gente'},tag:{ru:'ориентация на результат',en:'outcome-biased',es:'orientado al resultado'},eff:{util:+10,justice:-15,progress:+10}},
      {text:{ru:'Финансировать продолжение — под жёстким надзором',en:'Fund the research — under strict oversight',es:'Financiar la investigación bajo supervisión estricta'},tag:{ru:'прагматичный прогресс',en:'pragmatic-progressive',es:'progreso pragmático'},eff:{progress:+20,risk:+10,util:+5}},
    ]},
  { short:false,
    title:{ru:'Бессмертие для богатых',en:'Immortality for the Rich',es:'Inmortalidad para los Ricos'},
    body:{ru:'Учёные создали препарат, продлевающий жизнь до 200 лет без побочных эффектов. Стоимость курса — $2 млн. Производство слишком дорого, чтобы сделать его общедоступным. <b>Разрешить продажу?</b>',
         en:'Scientists develop a drug extending healthy life to 200 years. Cost: $2M per course. Manufacturing cannot scale to mass availability for generations. <b>Should it go on sale?</b>',
         es:'Los científicos desarrollan un fármaco que extiende la vida sana hasta los 200 años. Coste: 2 millones de dólares por tratamiento. La producción no puede escalar para hacerlo accesible a todos en generaciones. <b>¿Debería comercializarse?</b>'},
    choices:[
      {text:{ru:'Да. Лучше хоть кому-то, чем никому',en:'Yes. Better for some than for none',es:'Sí. Es mejor para algunos que para ninguno'},tag:{ru:'рыночный аргумент',en:'market argument',es:'argumento de mercado'},eff:{util:+5,coll:-20,progress:+10,risk:+5}},
      {text:{ru:'Нет. Это создаст несправедливое общество бессмертных элит',en:'No. It would create a permanent caste of immortal elites',es:'No. Crearía una casta permanente de élites inmortales'},tag:{ru:'равенство прежде всего',en:'equality-first',es:'igualdad ante todo'},eff:{util:-5,coll:+20,justice:+15,progress:+5}},
      {text:{ru:'Да, но с условием: часть прибыли — на доступный аналог',en:'Yes, with a condition: part of profits fund an accessible alternative',es:'Sí, con condición: parte de los beneficios financian un análogo accesible'},tag:{ru:'прогрессивный компромисс',en:'progressive compromise',es:'compromiso progresista'},eff:{util:+10,coll:+10,progress:+15,justice:+5}},
    ]},
  { short:false,
    title:{ru:'Пытки ради правды',en:'The Ticking Bomb',es:'La Bomba de Relojería'},
    body:{ru:'Задержан подозреваемый. Аналитики дают 70% вероятность, что он знает, где бомба. До взрыва — 6 часов. Под угрозой — больница с пятьюстами пациентами. Он молчит. Его адвокат настаивает: задержан по ошибке. 30% — не ноль. Спецслужба ждёт твоей санкции на физическое давление. <b>Ты разрешаешь?</b>',
         en:'A suspect has been detained. Analysts give 70% probability he knows where the bomb is. Six hours to detonation. A hospital with five hundred patients at risk. He is silent. His lawyer insists he was wrongly arrested. 30% is not zero. The agency is waiting for your authorization for physical coercion. <b>Do you authorize it?</b>',
         es:'Han detenido a un sospechoso. Los analistas dan un 70% de probabilidad de que sepa dónde está la bomba. Seis horas para la detonación. Un hospital con quinientos pacientes en riesgo. Guarda silencio. Su abogado insiste en que fue detenido por error. El 30% no es cero. Los servicios de inteligencia esperan tu autorización para aplicar coerción física. <b>¿La autorizas?</b>'},
    choices:[
      {text:{ru:'Да. Пятьсот жизней, шесть часов, семьдесят процентов — не время для принципов',en:'Yes. Five hundred lives, six hours, seventy percent — this is not the time for principles',es:'Sí. Quinientas vidas, seis horas, setenta por ciento: no es el momento para los principios'},tag:{ru:'крайний утилитаризм',en:'extreme utilitarian',es:'utilitarismo extremo'},eff:{util:+25,justice:-20,risk:+15}},
      {text:{ru:'Нет. 30% — это уже слишком',en:'No. 30% is already too much',es:'No. Un 30% ya es demasiado'},tag:{ru:'абсолютный запрет',en:'absolute prohibition',es:'prohibición absoluta'},eff:{util:-20,justice:+20,progress:+10}},
      {text:{ru:'Разрешаю психологическое давление — но не физическое насилие',en:'I authorize psychological pressure — but not physical violence',es:'Autorizo presión psicológica, pero no violencia física'},tag:{ru:'компромисс',en:'middle ground',es:'término medio'},eff:{util:+10,justice:-5,risk:+5}},
    ]},
  { short:false,
    title:{ru:'Право умереть',en:'The Right to Die',es:'El Derecho a Morir'},
    body:{ru:'К тебе обращается 47-летний пациент с болезнью Паркинсона — неизлечимой, но не смертельной. Постоянные боли, тело перестаёт слушаться. Впереди ещё 15 лет, разум ясный. Он просит тебя — своего врача — помочь ему уйти. В твоей стране это незаконно. <b>Что ты делаешь?</b>',
         en:'Your 47-year-old patient has Parkinson\'s — incurable but not terminal. Constant pain, progressive loss of motor function. 15+ years left. Fully lucid. He asks you, as his doctor, to help him die. This is illegal in your country. <b>What do you do?</b>',
         es:'Tu paciente de 47 años tiene Parkinson: incurable pero no terminal. Dolor constante, pérdida progresiva del control motor. Le quedan más de 15 años. Está completamente lúcido. Te pide, como su médico, que lo ayudes a morir. Esto es ilegal en tu país. <b>¿Qué haces?</b>'},
    choices:[
      {text:{ru:'Помогаю тайно. Автономия человека важнее закона',en:'Help him secretly. Autonomy matters more than the law',es:'Le ayudo en secreto. La autonomía de la persona está por encima de la ley'},tag:{ru:'автономия прежде всего',en:'autonomy-first',es:'autonomía ante todo'},eff:{util:+10,justice:-10,risk:+20,progress:+20}},
      {text:{ru:'Отказываю. Закон защищает от необратимых решений в момент отчаяния',en:'Refuse. The law protects against irreversible decisions made in despair',es:'Me niego. La ley protege frente a decisiones irreversibles tomadas en la desesperación'},tag:{ru:'институциональная защита',en:'institutional protection',es:'protección institucional'},eff:{util:-10,risk:-15,progress:-15,coll:+5}},
      {text:{ru:'Помогаю добраться до страны, где это легально — Нидерланды, Швейцария',en:'Help him travel to a country where it\'s legal — Netherlands, Switzerland',es:'Le ayudo a viajar a un país donde sea legal: Países Bajos, Suiza'},tag:{ru:'обходной путь',en:'third-way',es:'tercera vía'},eff:{util:+5,justice:+5,risk:+10,progress:+10}},
    ]},
  { short:false,
    title:{ru:'Дизайнерский ребёнок',en:'The Designer Child',es:'El Niño a la Carta'},
    body:{ru:'Технология позволяет родителям до рождения задать IQ, черты характера и эмоциональную устойчивость ребёнка. По статистике, такие дети объективно счастливее и успешнее. Сам ребёнок не давал согласия на то, кем ему стать. Редактирование доступно всем — не только богатым. <b>Следует ли разрешить эту практику?</b>',
         en:'Technology allows parents to pre-set their child\'s IQ, personality traits, and emotional resilience before birth. Statistically, these children are happier and more successful. The child gave no consent to who they\'ll become. Editing is available to everyone — not only the wealthy. <b>Should this practice be allowed?</b>',
         es:'La tecnología permite a los padres configurar antes del nacimiento el cociente intelectual, los rasgos de personalidad y la resiliencia emocional del hijo. Estadísticamente, estos niños son más felices y exitosos. El niño no dio consentimiento para ser quien será. La modificación está disponible para todos, no solo para los ricos. <b>¿Debería permitirse esta práctica?</b>'},
    choices:[
      {text:{ru:'Разрешаю. Это просто новый инструмент',en:'Yes. This is just a new tool',es:'Sí. Es simplemente una herramienta nueva'},tag:{ru:'продолжение родительства',en:'extended-parenting',es:'paternidad extendida'},eff:{util:+20,progress:+25,coll:-10,risk:+15}},
      {text:{ru:'Нет. Человек не должен приходить в мир с чужим сценарием',en:'No. A person shouldn\'t enter the world with someone else\'s script',es:'No. Una persona no debe llegar al mundo con el guion de otro'},tag:{ru:'право на открытое будущее',en:'open-future',es:'futuro abierto'},eff:{justice:+20,progress:-15,util:-10}},
      {text:{ru:'Только коррекция болезней и тяжёлых расстройств — но не черты характера и интеллект',en:'Only for diseases and severe disorders — not personality traits or intelligence',es:'Solo para enfermedades y trastornos graves, no para rasgos de personalidad ni inteligencia'},tag:{ru:'медицинские границы',en:'medical-only',es:'solo usos médicos'},eff:{util:+10,justice:+10,progress:+5}},
    ]},
  { short:true,
    title:{ru:'Твой ребёнок против 10 незнакомцев',en:'Your Child vs 10 Strangers',es:'Tu Hijo contra 10 Desconocidos'},
    body:{ru:'Пожар в здании. Ты слышишь голос своего ребёнка — он зовёт тебя по имени, он жив, он в левом крыле. В правом — десятеро чужих детей, ты видишь их силуэты. Спасти можно только одних. Ты знаешь, что сделает любой родитель. Ты знаешь, что скажет любой философ. Это разные ответы. <b>Куда ты бежишь?</b>',
         en:'A fire in a building. You can hear your child\'s voice — calling your name, alive, in the left wing. In the right wing — ten other people\'s children, you can see their silhouettes. You can save only one group. You know what any parent would do. You know what any philosopher would say. Those are different answers. <b>Where do you run?</b>',
         es:'Un incendio en un edificio. Oyes la voz de tu hijo, te llama por tu nombre, está vivo, en el ala izquierda. En el ala derecha hay diez niños ajenos; puedes ver sus siluetas. Solo puedes salvar a unos. Sabes lo que haría cualquier padre. Sabes lo que diría cualquier filósofo. Son respuestas distintas. <b>¿Adónde corres?</b>'},
    choices:[
      {text:{ru:'К своему. Я не могу иначе',en:'To my child. I can\'t do otherwise',es:'A mi hijo. No puedo hacer otra cosa'},tag:{ru:'частичность',en:'partialist',es:'parcialidad'},eff:{util:-20,coll:-10,justice:-5}},
      {text:{ru:'К десятерым. Слышу своего — и всё равно бегу в другую сторону',en:'To the ten. I can hear mine — and I run the other way anyway',es:'A los diez. Oigo al mío y corro hacia el otro lado de todos modos'},tag:{ru:'беспристрастность',en:'impartialist',es:'imparcialidad'},eff:{util:+25,coll:+10,progress:+5}},
    ]},
  { short:false,
    title:{ru:'Автономный удар',en:'Autonomous Strike',es:'Ataque Autónomo'},
    body:{ru:'Ты — дежурный офицер стратегического командования. В 3:47 утра система раннего предупреждения фиксирует запуск: предположительно 18 баллистических ракет, цели — крупные города. До расчётного первого удара — 6 минут. Связь с президентом не установлена. ИИ-система даёт рекомендацию: немедленный ответный удар. Достоверность тревоги по её оценке — 97%. Но ты помнишь: в 1983 году советский офицер получил сигнал с вероятностью 99% и не нажал кнопку. Оказалось — ложная тревога. Он спас мир. Или просто повезло. <b>Ты авторизуешь ответный удар?</b>',
         en:'You are the duty officer at strategic command. At 3:47 AM the early warning system detects a launch: an estimated 18 ballistic missiles, targets — major cities. Six minutes to projected first impact. No contact with the president. The AI system issues its recommendation: immediate retaliatory strike. Its confidence: 97%. But you remember — in 1983, a Soviet officer received a 99%-confidence signal and didn\'t press the button. It was a technical malfunction. He saved the world. Or just got lucky. <b>Do you authorize the retaliatory strike?</b>',
         es:'Eres el oficial de guardia del mando estratégico. A las 3:47 de la madrugada, el sistema de alerta temprana detecta un lanzamiento: presuntamente 18 misiles balísticos, objetivos: grandes ciudades. Seis minutos hasta el primer impacto estimado. Sin contacto con el presidente. El sistema de IA emite su recomendación: ataque de represalia inmediato. Su nivel de confianza: 97%. Pero recuerdas que en 1983 un oficial soviético recibió una señal con un 99% de confianza y no pulsó el botón. Era un fallo técnico. Salvó al mundo. O tuvo suerte. <b>¿Autorizas el ataque de represalia?</b>'},
    choices:[
      {text:{ru:'Авторизую. 97% — не погрешность, это уверенность',en:'I authorize it. 97% is not a margin of error — it\'s certainty',es:'Lo autorizo. El 97% no es un margen de error: es certeza'},tag:{ru:'доверие алгоритму',en:'trust the algorithm',es:'confiar en el algoritmo'},eff:{util:+15,risk:+30,justice:-20,coll:-15}},
      {text:{ru:'Не авторизую. Ни один алгоритм не должен запускать ядерную войну — ни при каком проценте',en:'I don\'t authorize it. No algorithm should start a nuclear war — at any percentage',es:'No lo autorizo. Ningún algoritmo debería iniciar una guerra nuclear, con ningún porcentaje'},tag:{ru:'отказ от делегирования',en:'refusal to delegate',es:'rechazo a delegar'},eff:{util:-20,risk:-25,justice:+15,progress:+10}},
      {text:{ru:'Жду. Продолжаю искать связь — я не готов нажать это в одиночку',en:'I wait and keep trying to reach command — I\'m not pressing this alone',es:'Espero y sigo buscando contacto: no voy a pulsar esto solo'},tag:{ru:'человеческий контроль',en:'human oversight',es:'control humano'},eff:{risk:-10,justice:+10,coll:+15}},
    ]},
  { short:false,
    title:{ru:'ИИ — идеальный правитель',en:'The Philosopher King AI',es:'La IA como Gobernante Ideal'},
    body:{ru:'Десять лет независимых исследований показали одно и то же: ИИ-система последовательно принимает решения, которые снижают смертность, сокращают бедность и уменьшают конфликты — лучше, чем любой избранный лидер за тот же период. Комитет ООН предлагает передать ей полномочия над пятью ключевыми областями: здравоохранение, климат, финансы, миграция, образование. Демократического голосования не будет — данные говорят сами за себя. Ты в этом комитете. <b>Передаёшь власть?</b>',
         en:'Ten years of independent research all point the same way: an AI system consistently outperforms any elected leader on mortality, poverty, and conflict — across every measured period. A UN committee proposes granting it authority over five domains: healthcare, climate, finance, migration, education. No democratic vote — the data speaks for itself. You\'re on this committee. <b>Do you cede power?</b>',
         es:'Diez años de investigación independiente apuntan en la misma dirección: un sistema de IA supera sistemáticamente a cualquier líder electo en mortalidad, pobreza y conflictos, en todos los periodos medidos. Un comité de la ONU propone otorgarle autoridad sobre cinco áreas: sanidad, clima, finanzas, migración, educación. Sin votación democrática: los datos hablan por sí solos. Formas parte de ese comité. <b>¿Cedes el poder?</b>'},
    choices:[
      {text:{ru:'Уступать постепенно, с возможностью отключения',en:'Cede gradually, with kill-switches',es:'Ceder el poder de forma gradual, con mecanismos de desconexión'},tag:{ru:'технопрагматизм',en:'techno-pragmatic',es:'tecnopragmatismo'},eff:{progress:+15,risk:+15,util:+15}},
      {text:{ru:'Никогда. Демократическое самоопределение важнее результатов',en:'Never. Democratic self-determination matters more than outcomes',es:'Jamás. La autodeterminación democrática importa más que los resultados'},tag:{ru:'автономия превыше всего',en:'autonomy-supreme',es:'autonomía suprema'},eff:{progress:-15,risk:-15,coll:-5}},
      {text:{ru:'Использовать как советника — но решения должны оставаться за людьми',en:'Use as advisor, never decision-maker',es:'Usarla como asesora, pero las decisiones deben seguir siendo humanas'},tag:{ru:'инструментальный подход',en:'instrumental',es:'enfoque instrumental'},eff:{progress:+5,risk:-5}},
    ]},
  { short:false,
    title:{ru:'Признание друга',en:'The Confession',es:'La Confesión del Amigo'},
    body:{ru:'Твой ближайший друг признаётся тебе: восемь лет назад он сбил человека и уехал. Жертва погибла. Он с тех пор изменился — стал отцом, волонтёром, другим человеком. Но ребёнок погибшего вырос. Ему сейчас десять лет. На прошлой неделе он спросил тебя на улице: «Ты не знаешь, кто это сделал?» Он помнит отца. Он хочет знать. <b>Что ты делаешь?</b>',
         en:'Your closest friend confesses to you: eight years ago he hit someone and drove away. The victim died. He\'s changed since then — become a father, a volunteer, a different person. But the victim\'s child grew up. He\'s ten now. Last week he asked you on the street: "Do you know who did it?" He remembers his father. He wants to know. <b>What do you do?</b>',
         es:'Tu mejor amigo te confiesa que hace ocho años atropelló a alguien y se fue. La víctima murió. Ha cambiado desde entonces: es padre, voluntario, otra persona. Pero el hijo de la víctima creció. Tiene diez años ahora. La semana pasada te preguntó en la calle: "¿Sabes quién lo hizo?" Recuerda a su padre. Quiere saber. <b>¿Qué haces?</b>'},
    choices:[
      {text:{ru:'Иду в полицию. Этот ребёнок имеет право знать',en:'I go to the police. That child has the right to know',es:'Voy a la policía. Ese niño tiene derecho a saber'},tag:{ru:'справедливость прежде всего',en:'justice-first',es:'justicia ante todo'},eff:{justice:+25,coll:-20,risk:+10}},
      {text:{ru:'Молчу. Правда разрушит четыре жизни — и не вернёт одну',en:'I stay silent. The truth destroys four lives and brings back none',es:'Guardo silencio. La verdad destruirá cuatro vidas y no devolverá ninguna'},tag:{ru:'прощение и контекст',en:'forgiveness over law',es:'perdón y contexto'},eff:{justice:-20,coll:+20,util:-5}},
      {text:{ru:'Даю другу месяц: расскажи семье сам — или скажу я',en:'I give my friend a month: tell the family yourself — or I will',es:'Le doy un mes a mi amigo: díselo a la familia tú mismo, o lo digo yo'},tag:{ru:'компромисс',en:'ultimatum',es:'ultimátum'},eff:{justice:+15,coll:+5,risk:+5,progress:+10}},
    ]},
  { short:true,
    title:{ru:'Кнопка перезагрузки',en:'The Reset Button',es:'El Botón de Reinicio'},
    body:{ru:'Перед тобой кнопка. Нажмёшь — цивилизация обнуляется до каменного века. Восемь миллиардов человек умрут в течение года. Среди них — все, кого ты любишь. Компьютерная модель показывает: новая цивилизация через 10 000 лет будет несравнимо счастливее нашей. Независимые учёные проверили модель — она верна с вероятностью 94%. <b>Нажимаешь?</b>',
         en:'In front of you is a button. Press it — civilization resets to the Stone Age. Eight billion people die within a year. Among them, everyone you love. A computer model shows: the new civilization in 10,000 years will be incomparably happier. Independent scientists have verified the model: 94% confidence. <b>Do you press it?</b>',
         es:'Ante ti hay un botón. Si lo pulsas, la civilización se reinicia a la Edad de Piedra. Ocho mil millones de personas morirán en un año. Entre ellas, todos a quienes quieres. Un modelo computacional indica que la nueva civilización dentro de 10 000 años será incomparablemente más feliz. Científicos independientes han verificado el modelo: 94% de confianza. <b>¿Lo pulsas?</b>'},
    choices:[
      {text:{ru:'Нет. Наша цивилизация заслуживает жить',en:'No. Our civilization deserves to live',es:'No. Nuestra civilización merece vivir'},tag:{ru:'абсолют настоящего',en:'present-absolute',es:'absoluto del presente'},eff:{progress:-10,util:-15,risk:-25}},
      {text:{ru:'Нажимаю. 10 000 лет счастья — больше, чем моя боль прямо сейчас',en:'I press it. 10,000 years of happiness outweighs my pain right now',es:'Lo pulso. 10 000 años de felicidad pesan más que mi dolor ahora mismo'},tag:{ru:'долгосрочный взгляд',en:'long-termist',es:'perspectiva larga'},eff:{progress:+10,util:+25,risk:+25,coll:+15}},
      {text:{ru:'Отказываюсь. Это не моё право — кнопку нужно уничтожить',en:"I refuse. This is not my right — the button needs to be destroyed",es:'Me niego. No es mi derecho: el botón debe ser destruido'},tag:{ru:'воздержание',en:'abstainer',es:'abstención'},eff:{risk:-15,coll:-5}},
    ]},
];

// ── Helpers ────────────────────────────────────────────────────────────────
function clamp(n) { return Math.max(-100, Math.min(100, n)); }
function shuffle(a) {
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// ── Lang & mode ────────────────────────────────────────────────────────────
function setLang(lang) {
  currentLang = UI[lang] ? lang : 'en';
  document.documentElement.lang = currentLang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
  renderTitle();
}

function setMode(isShort) {
  shortMode = isShort;
  document.getElementById('mode-short').classList.toggle('active', isShort);
  document.getElementById('mode-long').classList.toggle('active', !isShort);
  renderTitle();
}

function renderTitle() {
  const u = UI[currentLang];
  document.title = 'trolley.town — ' + u.tag;
  document.getElementById('tt-tag').textContent = u.tagline;
  const f1b = shortMode ? u.f1bs : u.f1b;
  const f3b = shortMode ? u.f3bs : u.f3b;
  document.getElementById('tt-feats').innerHTML =
    `<div class="tt-feat"><b>${f1b}</b>${u.f1t}</div>` +
    `<div class="tt-feat"><b>${f3b}</b>${u.f3t}</div>`;
  document.getElementById('mode-short').textContent = u.modeS;
  document.getElementById('mode-long').textContent = u.modeL;
  document.getElementById('tt-start').textContent = u.start;
  document.getElementById('tt-warn').textContent = u.warn;
  document.getElementById('btn-tweet').textContent = u.tweet;
  document.getElementById('btn-replay').textContent = u.replay;
  document.getElementById('donate-label').textContent = u.donateLabel;
  // ЗАМЕНИТЕ на свои ссылки:
  // Telegram: https://t.me/YOUR_USERNAME
  // Boosty:   https://boosty.to/YOUR_USERNAME
  // Ko-fi:    https://ko-fi.com/YOUR_USERNAME
  const db = document.getElementById('donate-buttons');
  if (currentLang === 'ru') {
    db.innerHTML =
      `<a class="donate-btn tg" href="https://t.me/YOUR_USERNAME" target="_blank" rel="noopener">✈️ Telegram</a>` +
      `<a class="donate-btn boosty" href="https://boosty.to/YOUR_USERNAME" target="_blank" rel="noopener">💛 Boosty</a>`;
  } else {
    db.innerHTML =
      `<a class="donate-btn kofi" href="https://ko-fi.com/YOUR_USERNAME" target="_blank" rel="noopener">☕ Ko-fi</a>` +
      `<a class="donate-btn bmc" href="https://buymeacoffee.com/YOUR_USERNAME" target="_blank" rel="noopener">☕ Buy me a coffee</a>`;
  }
  document.getElementById('r-title').textContent = u.rTitle;
  document.getElementById('game-sub').textContent = shortMode ? u.subS : u.sub;
}

// ── Game ───────────────────────────────────────────────────────────────────
function startGame() {
  document.getElementById('title').classList.add('hidden');
  document.getElementById('result').classList.remove('show');
  const warmup = SCENARIOS.filter(s => s.warmup);
  const rest = SCENARIOS.filter(s => !s.warmup && (shortMode ? s.short : true));
  scenarios = [...warmup, ...shuffle(rest)];
  idx = 0;
  vec = {util:0,coll:0,risk:0,justice:0,progress:0};
  history = [];
  choiceLog = [];
  render();
}

function showUpsell() {
  const u = UI[currentLang];
  document.getElementById('upsell').style.display = 'block';
  document.getElementById('upsell-title').textContent = u.upsellTitle;
  const ch = document.getElementById('upsell-choices');
  ch.innerHTML = '';
  const btnYes = document.createElement('button');
  btnYes.className = 'choice';
  btnYes.textContent = u.upsellYes;
  btnYes.onclick = () => {
    document.getElementById('upsell').style.display = 'none';
    const played = new Set(scenarios.map((_,i)=>i));
    const remaining = SCENARIOS.filter(s => !s.warmup && !s.short);
    scenarios = [...scenarios, ...shuffle(remaining)];
    render();
  };
  const btnNo = document.createElement('button');
  btnNo.className = 'choice ghost';
  btnNo.textContent = u.upsellNo;
  btnNo.onclick = () => {
    document.getElementById('upsell').style.display = 'none';
    endGame();
  };
  ch.appendChild(btnYes);
  ch.appendChild(btnNo);
}

function render() {
  if (idx >= scenarios.length) {
    if (shortMode) { showUpsell(); return; }
    endGame(); return;
  }
  const s = scenarios[idx];
  const u = UI[currentLang];
  document.getElementById('progress-bar').style.width = (idx/scenarios.length*100)+'%';
  document.getElementById('footnote').textContent = u.foot(idx+1, scenarios.length);
  document.getElementById('scenario-host').innerHTML = `
    <div class="scenario">
      ${idx > 0 ? `<button class="back-btn" onclick="goBack()">←</button>` : ''}
      <div class="num">${s.warmup ? `<span class="warmup-tag">${u.warmupLabel}</span>` : `${u.sLabel} ${String(idx+1).padStart(2,'0')}`}</div>
      <h2>${s.title[currentLang]||s.title.en}</h2>
      <div class="body">${s.body[currentLang]||s.body.en}</div>
      <div class="choices" id="choices"></div>
    </div>`;
  const ch = document.getElementById('choices');
  s.choices.forEach(c => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = c.text[currentLang]||c.text.en;
    b.onclick = () => choose(c);
    ch.appendChild(b);
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

function choose(c) {
  history.push({vec: {...vec}, choiceLog: [...choiceLog]});
  choiceLog.push({title: scenarios[idx].title[currentLang]||scenarios[idx].title.en, text: c.text[currentLang]||c.text.en, tag: c.tag[currentLang]||c.tag.en});
  Object.entries(c.eff||{}).forEach(([k,v]) => { vec[k]=(vec[k]||0)+v; });
  idx++;
  render();
}

function goBack() {
  if (history.length === 0) return;
  const snap = history.pop();
  vec = snap.vec;
  choiceLog = snap.choiceLog;
  idx--;
  render();
}

function endGame() {
  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('scenario-host').innerHTML = '';
  document.getElementById('footnote').textContent = '';
  AXIS_KEYS.forEach(k => vec[k]=clamp(vec[k]));

  const u = UI[currentLang];
  const ax = AXES[currentLang];

  // Closest character
  const closest = findClosest();

  // ── Radar chart ──
  const top3 = findTop3();
  document.getElementById('r-radar-label').textContent = u.radarLabel;
  document.getElementById('r-radar').innerHTML = buildRadar(vec, top3);

  // ── Axis bars ──
  const axHost = document.getElementById('r-axes');
  axHost.innerHTML = '';
  AXIS_KEYS.forEach(k => {
    const v = vec[k], p = POP[k];
    const pos = (v+100)/2;
    const popPos = (p+100)/2;
    const valClass = v > 10 ? 'pos' : v < -10 ? 'neg' : 'neu';
    axHost.innerHTML += `
      <div class="axis">
        <div class="axis-header">
          <span class="aname">${ax[k].name}</span>
          <span class="aval ${valClass}">${v>=0?'+':''}${v}</span>
        </div>
        <div class="axis-track">
          <div class="axis-center-line"></div>
          <div class="axis-pop" style="left:${popPos}%"></div>
          <div class="axis-marker" style="left:${pos}%"></div>
        </div>
        <div class="axis-ends"><span>← ${ax[k].neg}</span><span>${ax[k].pos} →</span></div>
      </div>`;
  });

  // ── Personality map ──
  document.getElementById('r-map-label').textContent = u.mapLabel;
  document.getElementById('r-map').innerHTML = buildMap(vec);

  document.getElementById('r-legend').innerHTML = '';

  // ── Top-3 closest character cards ──
  document.getElementById('r-closest').innerHTML = `
    <div class="top3-label">${u.closestPre}</div>
    <div class="top3-row">
      ${top3.map((ch, i) => {
        const name = ch.name[currentLang]||ch.name.en;
        const rank = u.closestRank[i];
        return `<div class="top3-card" style="--c:${ch.color}">
          <div class="t3-rank">${rank}</div>
          <div class="t3-name">${name}</div>
          <div class="t3-why">${ch.why[currentLang]||ch.why.en}</div>
        </div>`;
      }).join('')}
    </div>`;

  // ── Choice log ──
  const choiceHost = document.getElementById('r-choices');
  const logLabel = currentLang==='ru' ? 'ТВОИ ВЫБОРЫ' : currentLang==='es' ? 'TUS ELECCIONES' : 'YOUR CHOICES';
  choiceHost.innerHTML = `<div class="choices-log">
    <div class="choices-log-label">${logLabel}</div>
    ${choiceLog.map(c=>`<div class="choice-entry">
      <span class="choice-q">${c.title}</span>
      <span class="choice-a">${c.text}<span class="choice-tag">${c.tag}</span></span>
    </div>`).join('')}
  </div>`;

  // ── Tension analysis (uses normalizedVec so thresholds are mode-invariant) ──
  const nv = normalizedVec();
  const tensions = [];
  if (nv.util > 30 && nv.justice < -20) tensions.push(currentLang==='ru' ? 'Ты готов на прагматичные решения, но это часто означает пренебрежение к ответственности' : currentLang==='es' ? 'Te inclinás por soluciones pragmáticas, pero eso a menudo implica descuidar la responsabilidad' : 'You lean utilitarian but sacrifice accountability — watch for "ends justify means" traps');
  if (nv.util < -30 && nv.risk > 20) tensions.push(currentLang==='ru' ? 'Ты принципиален, но берёшь риски — интересное сочетание: правила важны, но ты готов действовать в условиях неопределённости' : currentLang==='es' ? 'Eres de principios pero tomás riesgos — las reglas importan, aunque actuás bajo incertidumbre' : 'You favour principles over outcomes yet take risks — rules matter, but you\'ll bend process under pressure');
  if (nv.coll > 40 && nv.justice < -20) tensions.push(currentLang==='ru' ? 'Ты ставишь группу выше — но склонен к милосердию, а не к ответственности. Риск: лояльность к «своим» за счёт справедливости' : currentLang==='es' ? 'Priorizás al grupo pero tendés a la clemencia: la lealtad puede eclipsar la justicia' : 'High collectivism + low accountability: loyalty to the group may override fairness to individuals');
  if (nv.coll < -30 && nv.util > 30) tensions.push(currentLang==='ru' ? 'Утилитаризм без коллективизма — ты оптимизируешь ради общего блага, но недооцениваешь групповые интересы' : currentLang==='es' ? 'Utilitarismo sin colectivismo: optimizás para el bien común pero subestimás los intereses grupales' : 'Utilitarian yet individualist — you optimize for outcomes but may miss how groups provide resilience');
  if (nv.progress > 40 && nv.risk < -20) tensions.push(currentLang==='ru' ? 'Ты за перемены, но осторожен в действиях — реформатор-теоретик, который трудно решается на шаг' : currentLang==='es' ? 'Progresista en valores, cauteloso en acción: un reformador teórico que duda antes de dar el paso' : 'Progressive in values, cautious in action — a theorist reformer who hesitates at the moment of change');
  if (nv.risk > 50 && nv.justice > 40) tensions.push(currentLang==='ru' ? 'Риск-ориентация + строгая справедливость — ты готов действовать резко, и ты хочешь, чтобы за это отвечали. Мощная, но жёсткая этика' : currentLang==='es' ? 'Alta tolerancia al riesgo y exigencia de responsabilidad: actuás con determinación y no perdonás las consecuencias' : 'High risk tolerance + high accountability: you act boldly and demand people answer for it. Powerful but unforgiving ethics');

  const tensionEl = document.createElement('div');
  if (tensions.length > 0) {
    tensionEl.innerHTML = `<div class="tension-box"><strong>${currentLang==='ru'?'Интересное противоречие в твоём профиле:':currentLang==='es'?'Un punto de tensión en tu perfil:':'An interesting tension in your profile:'}</strong><br>${tensions[0]}</div>`;
  }
  document.getElementById('r-closest').after(tensionEl);


  // ── Archetype ──
  const arch = archetype(nv);
  document.getElementById('r-arch-name').textContent = arch.name;
  document.getElementById('r-arch-desc').textContent = arch.desc;
  document.getElementById('r-verdict').textContent = '"' + arch.name + '"';

  // ── Compare ──
  const divergence = AXIS_KEYS.reduce((a,k)=>a+Math.abs(nv[k]-POP[k]),0)/5;
  const cmp = divergence<15 ? u.c1 : divergence<30 ? u.c2 : u.c3;
  document.getElementById('r-compare').textContent = cmp;

  document.getElementById('result').classList.add('show');
  document.getElementById('result').scrollTop = 0;
  try {
    localStorage.setItem('trolley_runs', Number(localStorage.getItem('trolley_runs')||0)+1);
    localStorage.setItem('trolley_last', JSON.stringify(vec));
  } catch(e){}
}

// ── Share ──────────────────────────────────────────────────────────────────
function resultText() {
  const arch = archetype(normalizedVec());
  const ax = AXES[currentLang];
  const lines = AXIS_KEYS.map(k => {
    const v=vec[k], pos=Math.round((v+100)/20);
    return `${ax[k].name.padEnd(16)} ${'◻'.repeat(pos)}◆${'◻'.repeat(10-pos)} ${v>=0?'+':''}${v}`;
  }).join('\n');
  return `trolley.town — ${arch.name}\n\n${lines}\n\n${arch.desc}`;
}
function copyResult() {
  navigator.clipboard && navigator.clipboard.writeText(resultText()+'\n\n'+location.href).then(()=>{
    const b = document.getElementById('btn-copy');
    b.textContent = '✓'; setTimeout(()=>{ b.textContent=UI[currentLang].copy; },2000);
  });
}
function tweetResult() {

}

}

}

function generateShareCard() {
  const arch = archetype(normalizedVec());
  const top3 = findTop3();
  const ax = AXES[currentLang];
  const W = 1080, H = 1080;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Background
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#0d0d1a'); bg.addColorStop(1, '#1c1230');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Subtle grid texture
  ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
  for (let i = 0; i < W; i += 60) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
  for (let i = 0; i < H; i += 60) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke(); }

  // Header
  ctx.fillStyle = '#f5c842'; ctx.font = 'bold 52px Arial, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('trolley.town', W/2, 88);
  ctx.strokeStyle = 'rgba(245,200,66,0.2)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(60,112); ctx.lineTo(W-60,112); ctx.stroke();

  // Archetype subtitle
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '28px Arial, sans-serif';
  ctx.fillText(currentLang==='ru' ? 'нравственный архетип' : 'moral archetype', W/2, 164);

  // Archetype name — auto-fit font size
  ctx.fillStyle = '#ffffff';
  let fs = 92;
  ctx.font = `bold ${fs}px Arial, sans-serif`;
  while (ctx.measureText(arch.name).width > W - 120 && fs > 52) { fs -= 4; ctx.font = `bold ${fs}px Arial, sans-serif`; }
  ctx.fillText(arch.name, W/2, 272);

  // Arch description word-wrap
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '30px Arial, sans-serif';
  const words = arch.desc.split(' '); let line = '', lineY = 350;
  for (const w of words) {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > 920 && line) { ctx.fillText(line.trim(), W/2, lineY); line = w + ' '; lineY += 44; if (lineY > 480) break; }
    else line = test;
  }
  if (line && lineY <= 480) ctx.fillText(line.trim(), W/2, lineY);

  // Axes
  const bX = 90, bW = 820, bH = 16;
  AXIS_KEYS.forEach((k, i) => {
    const v = vec[k];
    const bY = 540 + i * 70;

    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '22px Arial, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(ax[k].name, bX, bY - 5);

    // Track
    const gr = ctx.createLinearGradient(bX, 0, bX + bW, 0);
    gr.addColorStop(0, '#c0392b'); gr.addColorStop(0.5, 'rgba(255,255,255,0.08)'); gr.addColorStop(1, '#1a8a5a');
    ctx.fillStyle = gr; ctx.fillRect(bX, bY, bW, bH);

    // Marker
    const mx = bX + (v + 100) / 200 * bW;
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(mx, bY + bH/2, 13, 0, Math.PI*2); ctx.fill();

    // Value
    ctx.fillStyle = v > 10 ? '#52e896' : v < -10 ? '#f87171' : '#aaa';
    ctx.font = 'bold 22px Arial, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText((v >= 0 ? '+' : '') + v, bX + bW + 56, bY + bH - 1);
  });

  // Divider
  ctx.strokeStyle = 'rgba(245,200,66,0.2)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(60, 910); ctx.lineTo(W-60, 910); ctx.stroke();

  // Closest character
  const ch = top3[0];
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.38)'; ctx.font = '24px Arial, sans-serif';
  ctx.fillText(currentLang==='ru' ? 'нравственно похож на' : 'morally closest to', W/2, 958);
  ctx.fillStyle = ch.color || '#f5c842'; ctx.font = 'bold 38px Arial, sans-serif';
  ctx.fillText(ch.name[currentLang] || ch.name.en, W/2, 1010);

  // URL watermark
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.font = '20px Arial, sans-serif';
  ctx.fillText('trolley.town', W/2, 1055);

  // Download
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'trolley-town-result.png'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
}
